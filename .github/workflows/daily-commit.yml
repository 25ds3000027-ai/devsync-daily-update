name: Daily Auto Commit

on:
  schedule:
    - cron: '30 7 * * *'   # Runs daily at 07:30 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git
        run: |
          git config user.name "github-actions"
          git config user.email "25ds3000027@ds.study.iitm.ac.in"

      - name: Step with email 25ds3000027@ds.study.iitm.ac.in
        run: echo "Running daily update"

      - name: Create daily commit
        run: |
          echo "Last updated: $(date)" > daily-log.txt
          git add daily-log.txt
          git commit -m "Automated daily commit" || echo "No changes to commit"
          git push
